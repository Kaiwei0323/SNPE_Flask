name: Test Suite

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      working-directory: ./Tutorials
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-mock
        pip install Flask paho-mqtt || pip install --break-system-packages Flask paho-mqtt
    
    - name: Run unit tests
      working-directory: ./Tutorials
      run: |
        pytest tests/test_mqtt.py tests/test_snpe.py -v --tb=short
    
    - name: Generate coverage report
      working-directory: ./Tutorials
      run: |
        pytest tests/ --cov=. --cov-report=xml --cov-report=html || echo "Coverage report generation skipped"
      continue-on-error: true
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./Tutorials/coverage.xml
        flags: unittests
        name: codecov-umbrella
      continue-on-error: true

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-dev python3-pip mosquitto mosquitto-clients
    
    - name: Start Mosquitto
      run: |
        sudo systemctl start mosquitto || mosquitto -d || echo "Mosquitto start skipped"
      continue-on-error: true
    
    - name: Install Python dependencies
      working-directory: ./Tutorials
      run: |
        pip install pytest Flask paho-mqtt
    
    - name: Run integration tests
      working-directory: ./Tutorials
      run: |
        pytest tests/test_app.py -v --tb=short || echo "Integration tests may require additional setup"
      continue-on-error: true

